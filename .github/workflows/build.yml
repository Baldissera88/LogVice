name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Mono and msitools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mono-devel wixl msitools

      - name: Build LogVice.exe and LogVice.msi
        run: ./package.sh

      - name: Run tests
        run: ./tests/run.sh

      - name: Read version and product code
        id: info
        run: |
          version=$(msiinfo export LogVice.msi Property | awk -F'\t' '$1=="ProductVersion"{print $2}' | tr -d '\r')
          code=$(msiinfo export LogVice.msi Property | awk -F'\t' '$1=="ProductCode"{print $2}' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "LogVice $version, product code $code"

      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.info.outputs.version }}" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match version ${{ steps.info.outputs.version }} in LogVice.wxs"
            exit 1
          fi

      - name: Write checksums
        run: sha256sum LogVice.exe LogVice.msi > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            LogVice.exe
            LogVice.msi

      - name: Keep the build as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LogVice-${{ steps.info.outputs.version }}
          path: |
            LogVice.exe
            LogVice.msi
            SHA256SUMS.txt

      - name: Attach files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" LogVice.exe LogVice.msi SHA256SUMS.txt --clobber
          gh release view "$GITHUB_REF_NAME" --json body --jq .body | awk '/^### Deployment\r?$/{exit} {print}' > release-notes.md
          cp release-notes.md notes.md
          {
            echo
            echo "### Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Product code | \`${{ steps.info.outputs.code }}\` |"
            echo "| Install | \`msiexec /i LogVice.msi /qn\` |"
            echo "| Uninstall | \`msiexec /x ${{ steps.info.outputs.code }} /qn\` |"
            echo
            echo "### SHA256"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Built by GitHub Actions from commit ${GITHUB_SHA}. Verify a download with \`gh attestation verify LogVice.msi -R ${GITHUB_REPOSITORY}\`."
          } >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Write winget manifests
        if: github.event_name == 'release'
        run: ./winget/manifests.sh "${{ steps.info.outputs.version }}" LogVice.msi release-notes.md out/winget

      - name: Keep the winget manifests
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winget-${{ steps.info.outputs.version }}
          path: out/winget

  winget:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Get the winget manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: winget-${{ needs.build.outputs.version }}
          path: winget

      - name: Submit to winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $manifest = Join-Path -Path $PWD -ChildPath "winget\manifests\d\DanielBaldissera\LogVice\$env:VERSION"
          if (-not $env:WINGET_TOKEN) {
              Write-Output "::notice::The WINGET_TOKEN secret is not set, so nothing was submitted. Download the winget-$env:VERSION artifact and run: wingetcreate submit <folder>"
              exit 0
          }
          $exe = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile $exe
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
          if ($hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') {
              throw "wingetcreate.exe has an unexpected SHA256: $hash"
          }
          & $exe submit --token $env:WINGET_TOKEN --no-open $manifest
          if ($LASTEXITCODE -ne 0) {
              throw "wingetcreate failed with exit code $LASTEXITCODE."
          }
