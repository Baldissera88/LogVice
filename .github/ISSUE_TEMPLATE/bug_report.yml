name: Bug report
description: Something in LogVice does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LogVice version
      description: Shown in Settings > About.
      placeholder: "1.5.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - MSI
        - Portable exe
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2, Windows Server 2022"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what LogVice did instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log sample
      description: If a log does not parse well, paste a few lines of it here or attach the file. Remove computer names, user names and other private data first.
      render: text
  - type: textarea
    id: details
    attributes:
      label: About details
      description: Settings > About > Copy details, pasted here.
      render: text
